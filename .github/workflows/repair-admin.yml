name: Repair admin styles
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore responsive admin dashboard CSS
        shell: bash
        run: |
          cat > apps/admin/app/globals.css <<'CSS'
:root{--bg:#f7f7f5;--surface:#fff;--ink:#1f1f1d;--muted:#73736d;--line:#e7e7e2;--blue:#2563eb;--violet:#7c3aed;--green:#16a34a}*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}.shell{display:flex;min-height:100vh}.side{position:fixed;inset:0 auto 0 0;width:244px;padding:18px 12px 14px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:40}.brand{height:35px;display:flex;align-items:center;gap:9px;padding:0 10px;margin-bottom:20px;font-size:13px;font-weight:750;letter-spacing:-.04em}.brand em,.brandMobile em{font-style:normal;color:#999;font-size:8px;letter-spacing:.12em;margin-left:3px;font-weight:600}.brandMark{width:25px;height:25px;border-radius:7px;background:#20201e;color:#fff;display:grid;place-items:center;font-size:12px}.workspace{display:flex;align-items:center;gap:9px;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:#fafaf8;margin-bottom:18px}.workspace>div:nth-child(2){min-width:0;flex:1}.workspace strong,.workspace small{display:block}.workspace strong{font-size:11px}.workspace small{font-size:9px;color:var(--muted);margin-top:2px}.avatar,.profile{display:grid;place-items:center;width:27px;height:27px;border-radius:7px;background:#eeeef0;color:#555;font-size:8px;font-weight:700}.nav{display:flex;flex-direction:column;gap:2px}.nav a{height:35px;display:flex;align-items:center;gap:10px;padding:0 10px;border-radius:7px;color:#686863;text-decoration:none;font-size:11px;font-weight:500}.nav a:hover{background:#f5f5f2;color:var(--ink)}.nav a.active{background:#f0f3ff;color:#1d4ed8;font-weight:650}.navIcon{width:17px;text-align:center;font-size:13px;color:#989893}.nav a.active .navIcon{color:var(--blue)}.sideBottom{margin-top:auto;padding:11px 10px;border-top:1px solid var(--line);font-size:9px;color:#73736d;display:flex;align-items:center;gap:7px}.statusDot{width:6px;height:6px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 3px #dcfce7}.main{margin-left:244px;width:calc(100% - 244px);max-width:1540px;padding:28px 42px 70px}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:25px;margin-bottom:34px}.heading .kicker{font-size:9px;color:#999;letter-spacing:.1em;text-transform:uppercase}.heading h1{font-size:30px;line-height:1.05;letter-spacing:-.055em;margin:8px 0 7px;font-weight:650}.heading h1 span{color:var(--blue)}.heading p{font-size:12px;color:var(--muted);margin:0}.topActions{display:flex;align-items:center;gap:8px}.ghost,.iconButton{height:34px;border:1px solid var(--line);background:#fff;border-radius:7px;color:#777;font-size:11px}.ghost{padding:0 11px;min-width:95px;text-align:left}.iconButton{width:34px}.profile{width:31px;height:31px;background:#20201e;color:#fff;border-radius:50%}.mobileTop{display:none}.heroRow{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:18px}.eyebrow{font-size:9px;color:#92928b;letter-spacing:.11em;font-weight:650}.heroRow h2,.sectionHead h2{font-size:19px;line-height:1.1;letter-spacing:-.04em;margin:6px 0}.heroRow p{font-size:11px;color:var(--muted);margin:0}.primary{display:inline-flex;align-items:center;justify-content:center;background:#20201e;color:#fff;text-decoration:none;font-size:10px;font-weight:600;border-radius:7px;padding:10px 13px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.stat{position:relative;min-height:145px;padding:17px;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}.statLabel{display:block;font-size:10px;color:#777}.stat>strong{display:block;font-size:28px;letter-spacing:-.055em;margin-top:13px;font-weight:650}.delta{display:inline-block;margin-top:7px;font-size:9px;color:var(--green);font-weight:600}.spark{position:absolute;right:14px;bottom:17px;height:26px;width:72px;display:flex;align-items:flex-end;gap:3px}.spark i{display:block;flex:1;border-radius:2px 2px 0 0;background:#dce6ff}.spark i:nth-child(1){height:28%}.spark i:nth-child(2){height:42%}.spark i:nth-child(3){height:35%}.spark i:nth-child(4){height:58%}.spark i:nth-child(5){height:52%}.spark i:nth-child(6){height:74%}.spark i:nth-child(7){height:100%;background:#7da2ff}.section{margin-top:42px}.sectionHead{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:13px}.sectionHead a{font-size:10px;color:#666;text-decoration:none}.pipeline{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}.stage{min-width:0;padding:14px 12px 13px;text-decoration:none;color:var(--ink);border-right:1px solid var(--line)}.stage:last-child{border-right:0}.stage:hover{background:#fafafa}.stage>span{display:block;font-size:9px;color:#777;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stage>strong{display:block;font-size:19px;letter-spacing:-.04em;margin-top:8px}.stageBar{height:3px;background:#f0f0ec;border-radius:3px;margin-top:13px;overflow:hidden}.stageBar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#8eabff,#7c3aed)}.panel{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}.business{display:grid;grid-template-columns:34px minmax(170px,1.7fr) 120px 100px 125px 15px;align-items:center;gap:13px;min-height:67px;padding:10px 15px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}.business:last-child{border-bottom:0}.business:hover{background:#fafaf8}.businessLogo{width:32px;height:32px;display:grid;place-items:center;border-radius:8px;background:#f0f1f4;color:#555;font-size:8px;font-weight:700}.businessInfo{min-width:0}.businessInfo strong{display:block;font-size:11px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.businessInfo span{display:block;font-size:9px;color:#8b8b84;margin-top:4px}.tag{justify-self:start;font-size:8px;padding:5px 7px;border-radius:999px;background:#f1f1ee;color:#686861;white-space:nowrap}.opportunity small,.next small{display:block;color:#999;font-size:8px;margin-bottom:3px}.opportunity strong{font-size:13px}.opportunity strong span{font-size:8px;color:#999;font-weight:500}.next span{font-size:9px;color:#555}.chevron{color:#aaa;font-size:17px}@media(max-width:1100px){.side{width:205px}.main{margin-left:205px;width:calc(100% - 205px);padding:25px 28px}.pipeline{grid-template-columns:repeat(4,1fr)}.stage:nth-child(4){border-right:0}.stage:nth-child(-n+4){border-bottom:1px solid var(--line)}.business{grid-template-columns:34px minmax(150px,1.5fr) 105px 85px 105px 15px}}@media(max-width:800px){.side{display:none}.main{margin-left:0;width:100%;padding:18px 18px 55px}.top{display:block;margin-bottom:27px}.mobileTop{display:flex;align-items:center;gap:10px;margin-bottom:25px}.menu{border:1px solid var(--line);background:#fff;border-radius:7px;width:34px;height:34px;font-size:15px}.brandMobile{font-size:13px;font-weight:750;letter-spacing:-.04em}.topActions{position:absolute;right:18px;top:18px}.topActions .ghost{display:none}.heading h1{font-size:28px}.stats{grid-template-columns:1fr 1fr}.stat{min-height:128px}.stat>strong{font-size:24px}.heroRow{align-items:flex-start;flex-direction:column;gap:13px}.primary{width:100%}.pipeline{grid-template-columns:1fr 1fr}.stage:nth-child(2n){border-right:0}.stage:nth-child(n+7){border-bottom:0}.business{grid-template-columns:34px minmax(0,1fr) 16px;gap:10px;padding:11px 12px}.business .tag,.business .opportunity,.business .next{display:none}.section{margin-top:32px}.sectionHead{align-items:center}}@media(max-width:430px){.main{padding:15px 14px 45px}.topActions{right:14px}.heading h1{font-size:25px}.stats{gap:7px}.stat{padding:14px 12px;min-height:116px}.stat>strong{font-size:22px}.spark{display:none}.pipeline{border-radius:8px}.stage{padding:12px 10px}.stage>strong{font-size:17px}.business{min-height:63px}}
CSS
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin/app/globals.css
          git commit -m "Fix AgencyOS admin responsive styling" || true
          git push
